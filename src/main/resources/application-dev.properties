# ===========================================================================
#  Perfil "dev" — roda a aplicacao SEM precisar instalar o MySQL.
#  Usa banco H2 em memoria. Os dados sao recriados a cada inicializacao.
#
#  Como rodar:
#    Windows:      mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=dev"
#    Linux / Mac:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
#  Console do banco H2 (visualizar as tabelas/dados no navegador):
#    http://localhost:8080/h2-console
#    JDBC URL: jdbc:h2:mem:hospedagem   |   Usuario: sa   |   Senha: (vazia)
# ===========================================================================

spring.datasource.url=jdbc:h2:mem:hospedagem;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2 para inspecionar os dados
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Popula o banco com dados de exemplo ao iniciar (1 residencia, 2 quartos, 1 cliente)
hospedagem.seed.enabled=true
