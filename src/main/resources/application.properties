# ===========================================================================
#  Sistema de Hospedagem - Configuracao da aplicacao (perfil padrao)
# ===========================================================================
spring.application.name=sistema-hospedagem

# ---------------------------------------------------------------------------
#  Banco de dados - MySQL
#  Ajuste usuario/senha conforme seu ambiente, ou exporte as variaveis
#  de ambiente DB_USERNAME e DB_PASSWORD.
#  O parametro createDatabaseIfNotExist cria o schema "hospedagem" caso
#  ele ainda nao exista.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/hospedagem?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
#  JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
#  Regras de negocio - valores dos itens adicionais da diaria (em R$)
#  Somados ao valor base do quarto quando o quarto possui o item.
# ---------------------------------------------------------------------------
hospedagem.adicional.ar-condicionado=30.00
hospedagem.adicional.hidromassagem=50.00

# ---------------------------------------------------------------------------
#  Carga de dados de exemplo (opcional). Defina como true para popular o
#  banco com dados de demonstracao na primeira execucao.
# ---------------------------------------------------------------------------
hospedagem.seed.enabled=false

# ---------------------------------------------------------------------------
#  Documentacao da API (Swagger / OpenAPI)
#  Interface: http://localhost:8080/swagger-ui.html
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------------
#  Servidor
# ---------------------------------------------------------------------------
server.port=8080
