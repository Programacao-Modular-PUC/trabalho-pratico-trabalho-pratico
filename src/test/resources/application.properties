# ===========================================================================
#  Configuracao usada pelos testes automatizados
#  Banco H2 em memoria (nao exige MySQL instalado para rodar os testes).
# ===========================================================================
spring.datasource.url=jdbc:h2:mem:hospedagem_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

hospedagem.adicional.ar-condicionado=30.00
hospedagem.adicional.hidromassagem=50.00
hospedagem.seed.enabled=false
